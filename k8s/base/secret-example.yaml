# =============================================================================
# GEN3IA — EXEMPLE de Secret (k8s/base/secret-example.yaml)
#
# ⚠️ CE FICHIER N'EST PAS DANS LES `resources` DE LA KUSTOMIZATION —
# il n'est JAMAIS appliqué par `kubectl apply -k`. Il DOCUMENTE uniquement
# la liste attendue des clés. Aucune vraie valeur ne doit jamais être
# commitée (gitleaks actif — cf. .gitleaks.toml).
#
# CRÉATION RÉELLE (une fois par environnement) — depuis le .env.production
# du VPS en RETIRANT les NEXT_PUBLIC_* (inlinées au build, cf.
# deployment-app.yaml et deploy-vps.yml/DOTENV_PRODUCTION) :
#
#   grep -vE '^(NEXT_PUBLIC_|#|$)' .env.production > /tmp/runtime.env
#   kubectl create secret generic gen3ia-app-secrets \
#     --namespace gen3ia \
#     --from-env-file=/tmp/runtime.env
#
# Rotation : réexécuter create secret (ou `kubectl apply -f` d'un manifeste
# généré hors git) puis `kubectl rollout restart deployment/gen3ia-app` —
# envFrom ne recharge PAS à chaud.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: gen3ia-app-secrets
  namespace: gen3ia
type: Opaque
# stringData À TITRE D'ILLUSTRATION UNIQUEMENT (placeholders <>) :
# la vraie source reste `kubectl create secret --from-env-file`.
stringData:
  # --- Firebase Admin (lib/firebase/admin.ts) ---
  FIREBASE_PROJECT_ID: "<projet-firebase>"
  FIREBASE_CLIENT_EMAIL: "<service-account@projet.iam.gserviceaccount.com>"
  FIREBASE_PRIVATE_KEY: "<clé-privée-avec-\n-littéraux>"
  # --- Storage R2 / S3 (lib/storage/r2.ts) ---
  R2_ACCOUNT_ID: "<compte-r2>"
  R2_ACCESS_KEY_ID: "<access-key>"
  R2_SECRET_ACCESS_KEY: "<secret-key>"
  R2_BUCKET: "<bucket>"
  # --- Qdrant (lib/memory/vector-store.ts) — en cluster :
  QDRANT_URL: "http://gen3ia-qdrant.gen3ia.svc.cluster.local:6333"
  QDRANT_API_KEY: "<cle-api-qdrant-si-activee>"
  # --- Sécurité (Task I Zero Trust, metrics Task G) ---
  SESSION_SECRET: "<secret-session>"
  GEN3IA_SERVICE_TOKENS: "<identites-service-json>"
  METRICS_TOKEN: "<token-bearer-metrics>"
  # --- …toutes les autres variables RUNTIME du .env.production ---
  # (provider IA, Chariow, Resend, Composio, tokens d'intégrations…)
