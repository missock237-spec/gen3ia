# Dependabot (Task 104-e) — mises à jour de dépendances et d'actions.
# Version : mises à jour hebdomadaires groupées par écosystème ; les alertes
# de vulnérabilités sont activées séparément dans les réglages du dépôt.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      prod-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Next.js 15.5.x épinglé : une montée majeure (16.x) est une décision
      # d'architecture planifiée (ADR), pas une mise à jour automatique.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # @opentelemetry/api épinglé 1.9.x : @opentelemetry/resources@2.12.0
      # (déjà en place) exige le peer >=1.3.0 <1.10.0 — la montée minor
      # 1.9.x → 1.10.x viole cette borne (ERESOLVE, CI rouge systématique :
      # PR #116). La montée d'api se fera avec une montée coordonnée de
      # l'écosystème OTel (resources/sdk-node/exporters), décision ADR.
      - dependency-name: "@opentelemetry/api"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]

  # NB (2026-11-02) : la section « npm /sandbox » a été retirée — le
  # répertoire sandbox/ n'existe plus depuis la restructuration de la
  # racine (4ba979d) et faisait échouer le check Dependabot sur chaque
  # push touchant npm/actions (« failure » systématique).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
