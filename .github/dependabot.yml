# Dependabot (Task 104-e) — mises à jour de dépendances et d'actions.
# Version : mises à jour hebdomadaires groupées par écosystème ; les alertes
# de vulnérabilités sont activées séparément dans les réglages du dépôt.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      prod-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Next.js 15.5.x épinglé : une montée majeure (16.x) est une décision
      # d'architecture planifiée (ADR), pas une mise à jour automatique.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]

  # NB (2026-11-02) : la section « npm /sandbox » a été retirée — le
  # répertoire sandbox/ n'existe plus depuis la restructuration de la
  # racine (4ba979d) et faisait échouer le check Dependabot sur chaque
  # push touchant npm/actions (« failure » systématique).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
