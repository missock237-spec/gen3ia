name: Déploiement continu VPS

# Déploiement automatique de main vers le VPS de production.
# Pourquoi un build sur le runner GitHub ? Le VPS (2 Go RAM) ne peut pas
# compiler l'application (`next build` réclame > 3,5 Go de RSS — cf.
# next.config.ts : le type-check/lint sont déjà déplacés en CI pour la
# même raison). Le runner (7 Go) build, puis livre le .next au VPS qui
# applique son swap atomique (cf. infra/deploy/cd-finisher.sh) :
#   · staging isolé — l'app en ligne continue de servir pendant l'envoi ;
#   · swap .next + node_modules via cp -al / rsync, version précédente
#     conservée (.next.old) jusqu'au health check ;
#   · health check localhost:3000 — en cas d'échec, ROLLBACK automatique ;
#   · un SHA en échec est blacklisté (jamais de boucle de crash).
# Les variables NEXT_PUBLIC_* (config Firebase client) sont inlinées au
# build : elles proviennent du secret DOTENV_PRODUCTION (copie chiffrée
# du .env.production du VPS). SENTRY_AUTH_TOKEN y est vidé avant le build
# (next.config.ts : disable: !SENTRY_AUTH_TOKEN → pas de sourcemaps,
# ~2 Go RSS économisés et build aligné sur la recette validée).
# L'updater PM2 est suspendu pendant la bascule pour éviter la course
# avec le poller deploy.sh (relancé par trap, même en cas d'échec ;
# deploy.sh est lui-même un no-op depuis le 2026-10-21 — plus aucun
# build VPS possible).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

# contents:write : publication du build sur la release « cd-latest »
# (repli mode pull du VPS — cf. scripts/vps-auto-deploy/pull-deploy.sh).
permissions:
  contents: write

jobs:
  deploy:
    name: Build runner → swap atomique VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La config client Firebase (NEXT_PUBLIC_*) est inlinée dans le bundle
      # au build : sans elle, le site serait livré avec une auth cassée.
      # Le secret DOTENV_PRODUCTION est la copie exacte du .env.production
      # du VPS (gitignored). Le token Sentry est vidé pour le build.
      - name: Restaurer .env.production (NEXT_PUBLIC_* inline au build)
        run: |
          printf '%s' "$DOTENV_PRODUCTION" > .env.production
          sed -i 's/^SENTRY_AUTH_TOKEN=.*/SENTRY_AUTH_TOKEN=/' .env.production
          echo "Config restaurée : $(grep -c '=' .env.production) variables, Sentry build désactivé."
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Vérifier le BUILD_ID
        run: |
          test -f .next/BUILD_ID || { echo "::error::.next/BUILD_ID absent"; exit 1; }
          BUILD_ID=$(cat .next/BUILD_ID)
          echo "BUILD_ID=$BUILD_ID"
          # Capturé pour la vérification finale : la production doit servir
          # EXACTEMENT ce build (cf. dernière étape du job).
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Empaqueter .next (sans cache)
        run: tar czf /tmp/next-build.tar.gz --exclude='.next/cache' -C .next .

      # Durcissement 2026-10-26 (runs #79→#88 rouges : SCP reset par les
      # pénalités/fail2ban du VPS pendant ~16 h) : le build est publié en
      # release AVANT toute tentative SSH. Dépôt public → le VPS peut le
      # télécharger en HTTPS SORTANT (mode pull, zéro SSH entrant) via
      # scripts/vps-auto-deploy/pull-deploy.sh — un blocage SSH ne bloque
      # plus jamais la mise en production.
      # meta.json est téléversé en DERNIER : sa présence = build complet.
      - name: Publier le build sur la release cd-latest (repli mode pull)
        run: |
          SOMME=$(sha256sum /tmp/next-build.tar.gz | cut -d' ' -f1)
          printf '%s  next-build.tar.gz\n' "$SOMME" > /tmp/next-build.tar.gz.sha256
          printf '{"sha":"%s","buildId":"%s","publishedAt":"%s"}\n' \
            "$GITHUB_SHA" "$BUILD_ID" "$(date -u +%FT%TZ)" > /tmp/meta.json
          gh release view cd-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create cd-latest -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Build CD — dernier build runner" \
              --notes "Artefact de déploiement continu (mode pull VPS). Écrasé à chaque run."
          gh release upload cd-latest -R "$GITHUB_REPOSITORY" --clobber \
            /tmp/next-build.tar.gz /tmp/next-build.tar.gz.sha256
          gh release upload cd-latest -R "$GITHUB_REPOSITORY" --clobber /tmp/meta.json
          echo "Build $BUILD_ID (sha $GITHUB_SHA) publié sur la release cd-latest."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer la clé SSH VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          # keyscan NON FATAL : en cas de blocage passager du sshd VPS
          # (PerSourcePenalties / fail2ban / MaxStartups saturé par le bruit
          # SSH public — runs #43-#46), on ne meurt PAS ici : les options
          # accept-new des étapes suivantes acceptent l'hôte à la première
          # connexion réussie, et la vraie fenêtre de combat reste la boucle
          # de retry espacée du transfert.
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || \
            echo "⚠️ keyscan échoué (blocage SSH passager ?) — known_hosts incomplet, accept-new prendra le relais."

      - name: Envoyer build + finisher vers le VPS (retry PerSourcePenalties)
        run: |
          ok=0
          # PerSourcePenalties (OpenSSH 9.8+) : chaque connexion tentée PENDANT
          # une pénalité PROLONGE la pénalité — d'où un espacement LONG entre
          # essais (180 s) plutôt que des re-tentatives rapprochées qui
          # entretiennent le blocage (leçons des runs #43/#44/#45, 2026-10-23).
          # Chaque run GitHub part d'une IP egress différente : un blocage
          # persistant au-delà de ce step = blocage VPS côté sshd/firewall,
          # à lever sur le VPS (cf. docs/exploitation/ssh-bloque-runbook.md).
          for i in 1 2 3 4 5 6; do
            if scp -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -P "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 /tmp/next-build.tar.gz \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/next-build.tar.gz" \
            && scp -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -P "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 infra/deploy/cd-finisher.sh \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/cd-finisher.sh"; then
              ok=1; break
            fi
            echo "Tentative $i/6 échouée (réseau / PerSourcePenalties ?) — nouvel essai dans 180 s…"
            [ "$i" = "6" ] || sleep 180
          done
          [ "$ok" = "1" ] || { echo "::error::Transfert SCP impossible après 6 tentatives espacées — le build EST publié sur la release cd-latest : déployer en mode pull (curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash) ou rétablir le SSH (docs/exploitation/ssh-bloque-runbook.md)"; exit 1; }

      - name: Swap atomique + health check (rollback auto, retry raisonné)
        run: |
          ok=0
          for i in 1 2 3 4; do
            sortie=$(ssh -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                 "bash /tmp/cd-finisher.sh ${GITHUB_SHA}" 2>&1) && code=0 || code=$?
            echo "$sortie"
            case $code in
              0)
                ok=1; break ;;
              3)
                echo "::error::SHA ${GITHUB_SHA} est blacklisté sur le VPS (échec antérieur) — abandon sans nouvelle tentative.";
                exit 1 ;;
              2)
                echo "::error::Échec du health check — ROLLBACK appliqué côté VPS, SHA blacklisté. Retenter le même build serait une boucle de crash : abandon.";
                exit 1 ;;
              *)
                echo "Tentative $i/4 échouée (code $code — SSH/réseau transitoire ?) — nouvel essai dans 60 s…";
                sleep 60 ;;
            esac
          done
          [ "$ok" = "1" ] || { echo "::error::Application du déploiement impossible après 4 tentatives"; exit 1; }

      # VÉRIFICATION DE BOUT EN BOUT (durcissement 2026-10-22) : le health
      # check interne prouve que l'app répond — pas qu'elle sert LE build
      # livré par CE run. On compare l'empreinte /api/deploy-info (lue à la
      # requête depuis .next/BUILD_ID, cf. lib/deploy/build-id.ts) au BUILD_ID
      # compilé ci-dessus : un écart = workflow ROUGE, plus jamais un
      # déploiement « vert mais muet ».
      # Mise à jour forcée (plan 4 étapes, 2026-10-23) : /version.json
      # (manifeste statique copié dans public/ par cd-finisher.sh) doit
      # servir EXACTEMENT la même empreinte — c'est lui que les navigateurs
      # sondent pour se recharger tout seuls.
      - name: Vérifier que la production sert ce build exact
        run: |
          for i in 1 2 3 4 5; do
            reponse=$(ssh -o ServerAliveInterval=30 -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                 "curl -fsS -m 15 http://127.0.0.1:3000/api/deploy-info && echo && curl -fsS -m 15 http://127.0.0.1:3000/version.json" 2>/dev/null || true)
            # Le manifeste version.json est indenté (JSON.stringify p=2) :
            # « "version": "…" » avec espace après le deux-points — on
            # compacte AVANT le grep (correction 2026-10-23 : le grep
            # strict ne trouvait rien sur une réponse pourtant correcte,
            # run #34 rouge à tort alors que la production servait bien
            # le bon build).
            compacte=$(echo "$reponse" | tr -d ' \n\r')
            empreinte=$(echo "$compacte" | grep -o '"deploymentId":"[^"]*"' | tail -1 | sed -E 's/.*:"//; s/"$//' || true)
            manifeste=$(echo "$compacte" | grep -o '"version":"[^"]*"' | tail -1 | sed -E 's/.*:"//; s/"$//' || true)
            if [ "$empreinte" = "$BUILD_ID" ] && [ "$manifeste" = "$BUILD_ID" ]; then
              echo "Vérifié : la production sert le build $BUILD_ID (deploy-info + version.json alignés)."
              exit 0
            fi
            echo "Tentative $i/5 : deploy-info='$empreinte' version.json='$manifeste' ≠ attendu '$BUILD_ID' — nouvelle tentative dans 10 s…"
            sleep 10
          done
          echo "::error::La production ne sert PAS le build livré ($BUILD_ID) — déploiement à investiguer."
          exit 1

      - name: Nettoyage runner
        if: always()
        run: rm -f ~/.ssh/vps_deploy /tmp/next-build.tar.gz
