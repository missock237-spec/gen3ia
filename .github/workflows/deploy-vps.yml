name: Deploy VPS (mode libre)

# Déploiement de secours/main : exécute scripts/deploy_free_mode.sh sur le
# VPS Gen3ia depuis un runner GitHub (utile si l'IP locale est pénalisée
# par sshd PerSourcePenalties). Le script est idempotent : env
# GEN3IA_BILLING_ENABLED=false + git pull + build + pm2 reload + sondes.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (script de déploiement à jour)
        uses: actions/checkout@v4

      - name: Installer la clé SSH du VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          # Vérification de la validité de la clé
          ssh-keygen -y -f ~/.ssh/vps_key > /dev/null && echo "Clé privée valide"

      - name: Uploader et exécuter le script de déploiement
        env:
          TERM: dumb
        run: |
          set -eo pipefail
          # Keepalive SSH : le build next dure plusieurs minutes ; sans
          # ServerAliveInterval, une session sans trafic sortant peut être
          # coupée (« Broken pipe ») par un NAT/pare-feu intermédiaire.
          # ATTENTION aux drapeaux de port : scp = -P (majuscule), ssh = -p.
          # sshd PerSourcePenalties peut bloquer l'IP du runner quelques
          # minutes : boucles de RETRY avec délais LONGS + pipefail (un
          # `| tail` masque sinon le code d'échec — run 39288884878).
          # NOTE : AUCUN sondage nc/brut avant la connexion — une ligne
          # invalide envoyée à sshd (« Invalid SSH identification string »)
          # nourrit elle-même les pénalités PerSourcePenalties.
          COMMON="-i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o TCPKeepAlive=yes"

          upload_ok=false
          for i in 1 2 3 4 5; do
            echo "=== Tentative d'upload $i/5 ==="
            if scp -v -P 22022 $COMMON scripts/deploy_free_mode.sh root@209.74.86.62:/tmp/deploy_free_mode.sh 2>&1 | tail -8; then
              upload_ok=true
              break
            fi
            echo "Upload $i échoué (bannière/penalité sshd ?) — attente 120 s"
            sleep 120
          done
          if [ "$upload_ok" != true ]; then
            echo "##[error]Upload impossible après 5 tentatives"
            exit 1
          fi

          deploy_ok=false
          for i in 1 2 3; do
            echo "=== Tentative de déploiement $i/3 ==="
            if ssh -v -p 22022 $COMMON root@209.74.86.62 "bash -lc 'bash /tmp/deploy_free_mode.sh'" 2>&1 | tail -80; then
              deploy_ok=true
              break
            fi
            echo "Déploiement $i échoué — attente 120 s"
            sleep 120
          done
          if [ "$deploy_ok" != true ]; then
            echo "##[error]Déploiement impossible après 3 tentatives"
            exit 1
          fi
