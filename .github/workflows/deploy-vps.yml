name: Déploiement continu VPS

# Déploiement automatique de main vers le VPS de production.
# Pourquoi un build sur le runner GitHub ? Le VPS (2 Go RAM) ne peut pas
# compiler l'application (`next build` réclame > 3,5 Go de RSS — cf.
# next.config.ts : le type-check/lint sont déjà déplacés en CI pour la
# même raison). Le runner (7 Go) build, puis livre le .next au VPS qui
# applique son swap atomique (cf. deploy/cd-finisher.sh) :
#   · staging isolé — l'app en ligne continue de servir pendant l'envoi ;
#   · swap .next + node_modules via cp -al / rsync, version précédente
#     conservée (.next.old) jusqu'au health check ;
#   · health check localhost:3000 — en cas d'échec, ROLLBACK automatique ;
#   · un SHA en échec est blacklisté (jamais de boucle de crash).
# Les variables NEXT_PUBLIC_* (config Firebase client) sont inlinées au
# build : elles proviennent du secret DOTENV_PRODUCTION (copie chiffrée
# du .env.production du VPS). SENTRY_AUTH_TOKEN y est vidé avant le build
# (next.config.ts : disable: !SENTRY_AUTH_TOKEN → pas de sourcemaps,
# ~2 Go RSS économisés et build aligné sur la recette validée).
# L'updater PM2 est suspendu pendant la bascule pour éviter la course
# avec le poller deploy.sh (relancé par trap, même en cas d'échec ;
# deploy.sh est lui-même un no-op depuis le 2026-10-21 — plus aucun
# build VPS possible).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build runner → swap atomique VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # La config client Firebase (NEXT_PUBLIC_*) est inlinée dans le bundle
      # au build : sans elle, le site serait livré avec une auth cassée.
      # Le secret DOTENV_PRODUCTION est la copie exacte du .env.production
      # du VPS (gitignored). Le token Sentry est vidé pour le build.
      - name: Restaurer .env.production (NEXT_PUBLIC_* inline au build)
        run: |
          printf '%s' "$DOTENV_PRODUCTION" > .env.production
          sed -i 's/^SENTRY_AUTH_TOKEN=.*/SENTRY_AUTH_TOKEN=/' .env.production
          echo "Config restaurée : $(grep -c '=' .env.production) variables, Sentry build désactivé."
        env:
          DOTENV_PRODUCTION: ${{ secrets.DOTENV_PRODUCTION }}

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --include=dev --no-audit --no-fund

      - name: Build production
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Vérifier le BUILD_ID
        run: |
          test -f .next/BUILD_ID || { echo "::error::.next/BUILD_ID absent"; exit 1; }
          echo "BUILD_ID=$(cat .next/BUILD_ID)"

      - name: Empaqueter .next (sans cache)
        run: tar czf /tmp/next-build.tar.gz --exclude='.next/cache' -C .next .

      - name: Configurer la clé SSH VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Envoyer build + finisher vers le VPS (retry PerSourcePenalties)
        run: |
          ok=0
          for i in 1 2 3 4; do
            if scp -o ServerAliveInterval=30 -P "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 /tmp/next-build.tar.gz \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/next-build.tar.gz" \
            && scp -o ServerAliveInterval=30 -P "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 deploy/cd-finisher.sh \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/cd-finisher.sh"; then
              ok=1; break
            fi
            echo "Tentative $i/4 échouée (réseau / PerSourcePenalties ?) — nouvel essai dans 60 s…"
            sleep 60
          done
          [ "$ok" = "1" ] || { echo "::error::Transfert SCP impossible après 4 tentatives"; exit 1; }

      - name: Swap atomique + health check (rollback auto, retry)
        run: |
          for i in 1 2 3 4; do
            if ssh -o ServerAliveInterval=30 -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
                 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                 "bash /tmp/cd-finisher.sh ${GITHUB_SHA}"; then
              exit 0
            fi
            echo "Tentative $i/4 échouée — nouvel essai dans 60 s…"
            sleep 60
          done
          echo "::error::Application du déploiement impossible après 4 tentatives"
          exit 1

      - name: Nettoyage runner
        if: always()
        run: rm -f ~/.ssh/vps_deploy /tmp/next-build.tar.gz
