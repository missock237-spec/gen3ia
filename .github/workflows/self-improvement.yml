name: Self Improvement Quality Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        continue-on-error: true

      - name: Run Lint
        id: lint
        run: |
          npm run lint > lint_output.txt 2>&1 || true
          cat lint_output.txt

      - name: Run Typecheck
        id: typecheck
        run: |
          npx tsc --noEmit > tsc_output.txt 2>&1 || true
          cat tsc_output.txt

      - name: Create or Update Quality Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let lintOutput = '';
            let tscOutput = '';
            
            try { lintOutput = fs.readFileSync('lint_output.txt', 'utf8'); } catch (e) { lintOutput = 'N/A'; }
            try { tscOutput = fs.readFileSync('tsc_output.txt', 'utf8'); } catch (e) { tscOutput = 'N/A'; }

            const title = "Rapport d'auto-amélioration";
            const body = `## 📊 Rapport d'Auto-Amélioration Hédomadaire

### 🔍 Résultat ESLint
\`\`\`text
${lintOutput.slice(0, 2000)}
\`\`\`

### 🛡️ Résultat Typecheck (tsc)
\`\`\`text
${tscOutput.slice(0, 2000)}
\`\`\`

### 🚀 Actions Prioritaires d'Amélioration
1. Corriger les erreurs de typage TypeScript signalées ci-dessus.
2. Éliminer les avertissements ESLint et les imports inutilisés.
3. Vérifier la couverture de tests unitaires (Vitest) sur les nouveaux modules.
4. Mettre à jour les dépendances obsolètes ou présentant des vulnérabilités.
`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });
              console.log(`Created issue #${newIssue.number}`);
            }
