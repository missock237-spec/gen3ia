name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck · Lint · Tests · Audit · Build · Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (couverture avec seuils)
        run: npm run test:coverage

      - name: Build production
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

      - name: Budget bundle (First Load JS par route, gzip)
        run: npm run check:bundle

  e2e:
    name: "E2E Firebase (émulateurs : auth · firestore · règles)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache émulateurs Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Java (JRE) est pré-installé sur ubuntu-latest : requis par
      # l'émulateur Firestore. Les tests e2e ne touchent JAMAIS la
      # production (émulateurs locaux uniquement, projet demo-gen3ia).
      - name: E2E contre émulateurs (auth + wallet, équipes/agents/facturation, règles Firestore)
        run: npm run test:e2e

  secrets-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet pour le scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — détection de fuites
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
