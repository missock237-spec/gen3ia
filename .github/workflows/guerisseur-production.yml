name: Guérisseur production

# Rattrapage automatique de la production (gen3ia.online) vers main.
#
# Contexte (audit 2026-10-28) :
#   · Le canal SSH du CD est soumis à des blocages VPS par périodes
#     (fail2ban / PerSourcePenalties — 15 h observés les 26-27 oct.) ;
#   · Le canal pull « faisant autorité » (release cd-latest + poller VPS)
#     ne devient actif qu'après l'installation de
#     scripts/vps-auto-deploy/install-pull-mode.sh sur le VPS ;
#   · Les ticks planifiés du cron « */30 » (23:30, 00:00) ont été PERDUS
#     le 27-28 oct. — congestion GitHub documentée en tête d'heure.
#
# v2 (2026-10-28, itération Job 478451) — trois correctifs structurels :
#   1. CRON décalé hors des heures pleines ('13,43') + déclencheur PUSH :
#      chaque push sur main re-mesure l'écart même si les ticks planifiés
#      sont perdus (la garde anti-collision empêche toute course avec le
#      run CD déclenché par le même push) ;
#   2. ARMEMENT DU CANAL PULL PAR SSH : quand le sshd répond et que le
#      build de la release cd-latest correspond à main, le guérisseur
#      installe LUI-MÊME le poller sur le VPS (install-pull-mode.sh,
#      idempotent, premier déploiement immédiat) — la production est
#      rattrapée ET le VPS devient autonome vis-à-vis du SSH pour
#      toujours ;
#   3. SECOURS : si l'armement échoue ou si le build en release est
#      périmé (≠ main), déclenchement du CD (canal SSH historique).
#
# Une fois la production alignée, il reste totalement passif :
# 1 GET public + 1 GET API par tick, zéro coût.

on:
  schedule:
    # Décalé hors des heures pleines (congestion GitHub en tête d'heure).
    - cron: '13,43 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: guerisseur-production
  cancel-in-progress: false

jobs:
  verifier:
    name: Mesurer l'écart production ↔ main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      besoin: ${{ steps.ecart.outputs.besoin }}
      sha_main: ${{ steps.ecart.outputs.sha_main }}
      sha_prod: ${{ steps.ecart.outputs.sha_prod }}
    steps:
      - name: Comparer les empreintes
        id: ecart
        run: |
          cb=$(date +%s)
          SHA_MAIN=$(curl -fsSL -m 20 "https://api.github.com/repos/${{ github.repository }}/commits/main" \
            | jq -r '.sha // ""')
          REPONSE=$(curl -fsSL -m 20 "https://gen3ia.online/version.json?cb=$cb" || true)
          SHA_PROD=$(echo "$REPONSE" | jq -r '.gitSha // "absent"' 2>/dev/null || echo "absent")
          echo "main  = ${SHA_MAIN:-inconnu}"
          echo "prod  = ${SHA_PROD}"
          if [ -z "$SHA_MAIN" ]; then
            echo "besoin=false" >> "$GITHUB_OUTPUT"   # API muette : ne rien décider ce tick
            echo "besoin=false (API GitHub injoignable)"
          elif [ "$SHA_PROD" = "$SHA_MAIN" ]; then
            echo "besoin=false" >> "$GITHUB_OUTPUT"   # production alignée — passif
            echo "besoin=false (production alignée)"
          else
            echo "besoin=true" >> "$GITHUB_OUTPUT"    # en retard (ou version.json injoignable)
            echo "besoin=true (production en retard)"
          fi
          echo "sha_main=$SHA_MAIN" >> "$GITHUB_OUTPUT"
          echo "sha_prod=$SHA_PROD" >> "$GITHUB_OUTPUT"

  guerir:
    name: Armement pull (SSH) puis rattrapage
    needs: verifier
    if: needs.verifier.outputs.besoin == 'true'
    runs-on: ubuntu-latest
    # Premier déploiement pull = téléchargement de ~205 Mo sur le VPS
    # (jusqu'à 10 min dans pull-deploy.sh) + marges → 20 min ; l'attente
    # anti-course du CD (≤ 20 min, cf. garde) s'ajoute au pire cas.
    timeout-minutes: 45
    steps:
      - name: Configurer la clé SSH VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy

      # v3 (Job 478451, anomalie constatée 01:14 UTC) : un guérisseur
      # déclenché par PUSH est TOUJOURS en course avec le run CD du même
      # push (il le voit « in_progress » et s'éliminait) — et les ticks
      # cron GitHub sont régulièrement PERDUS (congestion documentée) :
      # résultat observé = prod en retard de 7 commits ~8 h sans aucun
      # rattrapage. Correctif : au lieu de sauter quand le CD est en
      # cours, le guérisseur ATTEND sa fin (poll 60 s, borné à 20 min —
      # un build runner dure ~13-14 min) puis décide normalement.
      #   · CD terminé « success » (build publié, canal SSH best-effort)
      #     ou « cancelled » (la release peut être fraîche) → libre, la
      #     vérification release_sha == main reste la garde finale ;
      #   · CD « failure » → bloque (ne pas réarmer un build en échec) ;
      #   · toujours en cours après 20 polls → bloque ce tick (un tick
      #     suivant ou un push re-évaluera).
      - name: "Garde — anti-course : attendre la fin du CD puis décider"
        id: garde
        run: |
          SHA_MAIN="${{ needs.verifier.outputs.sha_main }}"
          lire_etat() {
            LECTURE=$(curl -fsSL -m 20 -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-vps.yml/runs?per_page=30")
            EN_COURS=$(echo "$LECTURE" | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')
            DERNIER_CE_SHA=$(echo "$LECTURE" | jq -r --arg sha "$SHA_MAIN" \
              '[.workflow_runs[] | select(.head_sha==$sha)][0] | (.conclusion // .status // "aucun")')
          }
          for i in $(seq 1 20); do
            lire_etat || true
            # La release est la source de vérité du canal pull : dès que
            # meta.json porte le SHA de main, le build est complet et
            # disponible — inutile d'attendre la fin des phases SSH
            # best-effort du CD (l'armement et le finisher sérialisent
            # leurs swaps par flock).
            RELEASE_SHA=$(curl -fsSL -m 20 -H "Cache-Control: no-cache" \
              "https://github.com/${{ github.repository }}/releases/download/cd-latest/meta.json?_=$(date +%s)" 2>/dev/null \
              | grep -o '"sha":"[0-9a-f]*"' | head -1 | sed 's/.*:"//; s/"$//' || true)
            echo "poll $i/20 — CD en cours : $EN_COURS, dernier run : $DERNIER_CE_SHA, release : ${RELEASE_SHA:-absent}"
            if [ "$RELEASE_SHA" = "$SHA_MAIN" ]; then
              echo "Release cd-latest à jour ($SHA_MAIN) — le canal pull est autonome, fin d'attente."
              EN_COURS=0
              break
            fi
            if [ "$EN_COURS" != "0" ]; then sleep 60; else break; fi
          done
          if [ "$EN_COURS" != "0" ]; then
            echo "verdict=bloque (CD toujours en cours après 20 min d'attente)"
            LIBRE=non
          elif [ "$DERNIER_CE_SHA" = "failure" ]; then
            echo "verdict=bloque (build $SHA_MAIN en échec — ne pas réarmer)"
            LIBRE=non
          else
            echo "verdict=libre"
            LIBRE=oui
          fi
          echo "libre=$LIBRE" >> "$GITHUB_OUTPUT"

      - name: Empreinte du build publié sur la release cd-latest
        id: release
        if: steps.garde.outputs.libre == 'oui'
        run: |
          META=$(curl -fsSL -m 20 -H "Cache-Control: no-cache" \
            "https://github.com/${{ github.repository }}/releases/download/cd-latest/meta.json?_=$(date +%s)" || true)
          RS=$(printf '%s' "$META" | grep -o '"sha":"[0-9a-f]*"' | head -1 | sed 's/.*:"//; s/"$//' || true)
          echo "release_sha=${RS:-absent}" >> "$GITHUB_OUTPUT"
          echo "Release cd-latest : ${RS:-absent}"
          echo "main              : ${{ needs.verifier.outputs.sha_main }}"

      - name: Sondage SSH léger (3 essais espacés)
        id: sonde
        if: steps.garde.outputs.libre == 'oui'
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 12 ssh-keyscan -T 8 -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" 2>/dev/null | grep -q "ssh-"; then
              ok=1
              echo "Sondage $i/3 : sshd répond — armement du canal pull possible."
              break
            fi
            echo "Sondage $i/3 : SSH muet (fail2ban / PerSourcePenalties ?) — production rattrapée au prochain tick ou par le poller pull."
            [ "$i" = "3" ] || sleep 30
          done
          echo "joignable=$([ $ok = 1 ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"

      # ARMEMENT DU CANAL PULL (le cœur du correctif structurel) :
      # install-pull-mode.sh est idempotent, non interactif, sans entrée
      # clavier. Il installe le poller PM2 (toutes les 2 min) PUIS lance
      # immédiatement le premier déploiement : la production rattrape main
      # pendant ce step, puis le VPS se déploie seul pour toujours
      # (téléchargement HTTPS sortant de la release, zéro SSH entrant).
      # Si le build en release est PÉRIMÉ (≠ main), on ne l'arme pas :
      # le secours CD publie un build frais d'abord.
      - name: Armer le canal pull sur le VPS (poller idempotent + déploiement immédiat)
        id: pull
        if: steps.sonde.outputs.joignable == 'oui' && steps.release.outputs.release_sha == needs.verifier.outputs.sha_main
        run: |
          if ssh -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
               -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
               "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
               "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash"; then
            echo "verdict=arme" >> "$GITHUB_OUTPUT"
            echo "✅ Canal pull ARMÉ : poller PM2 installé, premier déploiement lancé."
          else
            echo "verdict=echec" >> "$GITHUB_OUTPUT"
            echo "⚠️ Armement du canal pull échoué (permissions / coupure SSH ?) — secours CD."
          fi

      - name: Secours — déclencher le déploiement continu (canal SSH)
        if: steps.sonde.outputs.joignable == 'oui' && steps.pull.outputs.verdict != 'arme'
        run: |
          gh workflow run deploy-vps.yml --ref main -R "${{ github.repository }}"
          echo "✅ CD déclenché : production ${{ needs.verifier.outputs.sha_prod }} → main ${{ needs.verifier.outputs.sha_main }}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rapport du tick
        if: always()
        run: |
          echo "=== Guérisseur — tick $(date -u +%FT%TZ) ==="
          echo "prod    = ${{ needs.verifier.outputs.sha_prod }}"
          echo "main    = ${{ needs.verifier.outputs.sha_main }}"
          echo "release = ${{ steps.release.outputs.release_sha }}"
          echo "garde   = ${{ steps.garde.outcome }} (${{ steps.garde.outputs.libre }})"
          echo "sonde   = ${{ steps.sonde.outcome }} (${{ steps.sonde.outputs.joignable }})"
          echo "pull    = ${{ steps.pull.outcome }} (${{ steps.pull.outputs.verdict }})"
          echo "Rappel : le canal pull (poller VPS, install console unique) rend ce rattrapage instantané —"
          echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash"

      # ESCALADE VISIBLE (correctif Job 478451 — constat du 2026-10-28) :
      # quand la production est en retard ET le SSH muet, ce workflow
      # finissait « success » sans rien faire ni rien dire — une production
      # a pu rester gelée ~8 h (8 commits) sans AUCUN signal. Désormais :
      # ouverture/mise à jour d'une issue dédiée avec l'action exacte à
      # mener sur la console du fournisseur (installation du mode pull,
      # une seule commande, sans SSH). L'issue est refermée automatiquement
      # dès que la production est réalignée (tick « besoin=false »).
      - name: "Escalade — issue visible quand prod en retard + SSH muet"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_MAIN: ${{ needs.verifier.outputs.sha_main }}
          SHA_PROD: ${{ needs.verifier.outputs.sha_prod }}
          BESOIN: ${{ needs.verifier.outputs.besoin }}
          JOIGNABLE: ${{ steps.sonde.outputs.joignable }}
          REPO: ${{ github.repository }}
        run: |
          TITRE="🚨 Production en retard sur main — intervention console VPS requise"
          if [ "$BESOIN" != "true" ]; then
            # Production alignée : refermer l'issue d'escalade si elle existe.
            NUM=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" -R "$REPO" -c "✅ Production réalignée sur main ($SHA_MAIN) — escalade résolue automatiquement."
              echo "Issue #$NUM refermée (production alignée)."
            fi
            exit 0
          fi
          # Production en retard : n'escalader que si SSH muet (sinon le
          # guérisseur/CD gèrent le rattrapage sans bruit).
          if [ "$JOIGNABLE" = "oui" ]; then
            echo "SSH joignable — rattrapage en cours par les canaux normaux, pas d'escalade."
            exit 0
          fi
          CORPS=$(cat <<'EOF'
          ## Production gen3ia.online en retard sur main

          - SHA main        : `%SHA_MAIN%`
          - SHA production  : `%SHA_PROD%`
          - SSH entrant     : muet (fail2ban / PerSourcePenalties côté VPS)
          - Canal pull      : poller VPS non installé (bootstrap jamais fait)

          **Conséquence** : les builds CD sont publiés sur la release `cd-latest`
          mais la production ne les récupère jamais — corrections utilisateur
          (anti-désinformation, statut, CVE) invisibles en production.

          **Action unique à mener depuis la console du fournisseur VPS
          (spaceship.com → console root)** — une seule commande, sans SSH :

          ```
          curl -fsSL https://raw.githubusercontent.com/missock237-spec/gen3ia/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash
          ```

          Elle installe le poller (2 min de cycle, HTTPS sortant uniquement),
          lance immédiatement le premier déploiement, et rend le VPS autonome
          vis-à-vis du SSH pour toujours. Vérification ensuite :

          ```
          curl -s https://gen3ia.online/version.json
          ```

          _Issue ouverte automatiquement par le guérisseur (Job 478451).
          Refermeture automatique dès que la production est alignée._
          EOF
          )
          CORPS="${CORPS//\%SHA_MAIN\%/$SHA_MAIN}"
          CORPS="${CORPS//\%SHA_PROD\%/$SHA_PROD}"
          NUM=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$REPO" -b "Tick $(date -u +%FT%TZ) — toujours en retard : prod=$SHA_PROD, main=$SHA_MAIN, SSH muet."
            echo "Issue #$NUM commentée (escalade en cours)."
          else
            gh issue create -R "$REPO" --title "$TITRE" --body "$CORPS" >/dev/null \
              && echo "Issue d'escalade créée."
          fi
