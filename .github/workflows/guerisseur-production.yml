name: Guérisseur production

# Rattrapage automatique de la production (gen3ia.online) vers main.
#
# Contexte (audit 2026-10-28) :
#   · Le canal SSH du CD est soumis à des blocages VPS par périodes
#     (fail2ban / PerSourcePenalties — 15 h observés les 26-27 oct.) ;
#   · Le canal pull « faisant autorité » (release cd-latest + poller VPS)
#     ne devient actif qu'après l'installation de
#     scripts/vps-auto-deploy/install-pull-mode.sh sur le VPS ;
#   · Les ticks planifiés du cron « */30 » (23:30, 00:00) ont été PERDUS
#     le 27-28 oct. — congestion GitHub documentée en tête d'heure.
#
# v2 (2026-10-28, itération Job 478451) — trois correctifs structurels :
#   1. CRON décalé hors des heures pleines ('13,43') + déclencheur PUSH :
#      chaque push sur main re-mesure l'écart même si les ticks planifiés
#      sont perdus (la garde anti-collision empêche toute course avec le
#      run CD déclenché par le même push) ;
#   2. ARMEMENT DU CANAL PULL PAR SSH : quand le sshd répond et que le
#      build de la release cd-latest correspond à main, le guérisseur
#      installe LUI-MÊME le poller sur le VPS (install-pull-mode.sh,
#      idempotent, premier déploiement immédiat) — la production est
#      rattrapée ET le VPS devient autonome vis-à-vis du SSH pour
#      toujours ;
#   3. SECOURS : si l'armement échoue ou si le build en release est
#      périmé (≠ main), déclenchement du CD (canal SSH historique).
#
# Une fois la production alignée, il reste totalement passif :
# 1 GET public + 1 GET API par tick, zéro coût.
#
# v5 (2026-10-29, itération 20 Job 478451) — anti-faux-positif escalade :
#   Fait observé 00:27 UTC : le CD du même push a livré main à 00:25:36
#   (swap atomique), mais l'escalade a commenté « toujours en retard :
#   prod=51d9d9b6 » à 00:27:51 — le SHA_PROD venait du job verifier,
#   mesuré ~5 min plus tôt, AVANT la livraison. Correctifs :
#   1. Re-mesure fraîche de la production (3 lectures espacées,
#      cache-buster) AVANT tout commentaire d'escalade — si main a été
#      livrée entre-temps, refermer l'escalade au lieu de brailler ;
#   2. Garde « CD en cours » : un run deploy-vps in_progress/queued sur
#      le SHA de main = livraison possible en cours → pas d'escalade ce
#      tick (le CD est un canal de livraison légitime) ;
#   3. Cron décalé encore plus loin des minutes contendedues ('17,47') :
#      les ticks 00:43 et 01:13 du planning '13,43' ont été PERDUS le
#      29 oct. (congestion GitHub), laissant l'escalade sans re-mesure.
#
# v6 (2026-10-29, itération 21 Job 478451) — garde fail-closed :
#   Fait observé 01:45 UTC : l'appel API « runs du CD » a échoué (rate
#   limit) et le repli « || echo 0 » a FAIL-OPEN → escalade #108 créée
#   pendant que le CD du même push livrait (swap ~1 min après). Le garde
#   réessaie désormais 3× ; API injoignable = PAS d'escalade ce tick
#   (fail-closed), et le CD referme lui-même l'escalade après avoir
#   PROUVÉ la livraison (deploy-vps.yml v6, refermeture à la source).

on:
  schedule:
    # Décalé hors des heures pleines ET des minutes demi-heure (congestion
    # GitHub documentée — ticks 00:43/01:13 de '13,43' perdus le 29 oct.).
    - cron: '17,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: guerisseur-production
  cancel-in-progress: false

jobs:
  verifier:
    name: Mesurer l'écart production ↔ main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      besoin: ${{ steps.ecart.outputs.besoin }}
      sha_main: ${{ steps.ecart.outputs.sha_main }}
      sha_prod: ${{ steps.ecart.outputs.sha_prod }}
    steps:
      - name: Comparer les empreintes
        id: ecart
        run: |
          cb=$(date +%s)
          SHA_MAIN=$(curl -fsSL -m 20 "https://api.github.com/repos/${{ github.repository }}/commits/main" \
            | jq -r '.sha // ""')
          REPONSE=$(curl -fsSL -m 20 "https://gen3ia.online/version.json?cb=$cb" || true)
          SHA_PROD=$(echo "$REPONSE" | jq -r '.gitSha // "absent"' 2>/dev/null || echo "absent")
          echo "main  = ${SHA_MAIN:-inconnu}"
          echo "prod  = ${SHA_PROD}"
          if [ -z "$SHA_MAIN" ]; then
            echo "besoin=false" >> "$GITHUB_OUTPUT"   # API muette : ne rien décider ce tick
            echo "besoin=false (API GitHub injoignable)"
          elif [ "$SHA_PROD" = "$SHA_MAIN" ]; then
            echo "besoin=false" >> "$GITHUB_OUTPUT"   # production alignée — passif
            echo "besoin=false (production alignée)"
          else
            echo "besoin=true" >> "$GITHUB_OUTPUT"    # en retard (ou version.json injoignable)
            echo "besoin=true (production en retard)"
          fi
          echo "sha_main=$SHA_MAIN" >> "$GITHUB_OUTPUT"
          echo "sha_prod=$SHA_PROD" >> "$GITHUB_OUTPUT"

      # Bug constaté 2026-10-28 06:00 UTC : la refermeture de l'escalade
      # vivait dans l'étape « Escalade » du job `guerir` (if: always() AU
      # NIVEAU STEP seulement) — mais ce job entier est SKIPPÉ quand
      # besoin=false, exactement au moment où il faut refermer l'issue.
      # La refermeture vit donc ICI, dans le job `verifier` qui tourne
      # TOUJOURS (aligné ou non).
      - name: "Refermer l'escalade — production réalignée"
        if: steps.ecart.outputs.besoin != 'true' && steps.ecart.outputs.sha_main != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_MAIN: ${{ steps.ecart.outputs.sha_main }}
          REPO: ${{ github.repository }}
        run: |
          TITRE="🚨 Production en retard sur main — intervention console VPS requise"
          NUM=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" -R "$REPO" -c "✅ Production réalignée sur main ($SHA_MAIN) — escalade résolue automatiquement."
            echo "Issue #$NUM refermée (production alignée)."
          else
            echo "Aucune escalade ouverte — rien à refermer."
          fi

  guerir:
    name: Armement pull (SSH) puis rattrapage
    needs: verifier
    if: needs.verifier.outputs.besoin == 'true'
    runs-on: ubuntu-latest
    # Premier déploiement pull = téléchargement de ~205 Mo sur le VPS
    # (jusqu'à 10 min dans pull-deploy.sh) + marges → 20 min ; l'attente
    # anti-course du CD (≤ 20 min, cf. garde) s'ajoute au pire cas.
    timeout-minutes: 45
    steps:
      - name: Configurer la clé SSH VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy
          chmod 600 ~/.ssh/vps_deploy

      # v3 (Job 478451, anomalie constatée 01:14 UTC) : un guérisseur
      # déclenché par PUSH est TOUJOURS en course avec le run CD du même
      # push (il le voit « in_progress » et s'éliminait) — et les ticks
      # cron GitHub sont régulièrement PERDUS (congestion documentée) :
      # résultat observé = prod en retard de 7 commits ~8 h sans aucun
      # rattrapage. Correctif : au lieu de sauter quand le CD est en
      # cours, le guérisseur ATTEND sa fin (poll 60 s, borné à 20 min —
      # un build runner dure ~13-14 min) puis décide normalement.
      #   · CD terminé « success » (build publié, canal SSH best-effort)
      #     ou « cancelled » (la release peut être fraîche) → libre, la
      #     vérification release_sha == main reste la garde finale ;
      #   · CD « failure » → bloque (ne pas réarmer un build en échec) ;
      #   · toujours en cours après 20 polls → bloque ce tick (un tick
      #     suivant ou un push re-évaluera).
      - name: "Garde — anti-course : attendre la fin du CD puis décider"
        id: garde
        run: |
          SHA_MAIN="${{ needs.verifier.outputs.sha_main }}"
          lire_etat() {
            LECTURE=$(curl -fsSL -m 20 -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-vps.yml/runs?per_page=30")
            EN_COURS=$(echo "$LECTURE" | jq '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued")] | length')
            DERNIER_CE_SHA=$(echo "$LECTURE" | jq -r --arg sha "$SHA_MAIN" \
              '[.workflow_runs[] | select(.head_sha==$sha)][0] | (.conclusion // .status // "aucun")')
          }
          for i in $(seq 1 20); do
            lire_etat || true
            # La release est la source de vérité du canal pull : dès que
            # meta.json porte le SHA de main, le build est complet et
            # disponible — inutile d'attendre la fin des phases SSH
            # best-effort du CD (l'armement et le finisher sérialisent
            # leurs swaps par flock).
            RELEASE_SHA=$(curl -fsSL -m 20 -H "Cache-Control: no-cache" \
              "https://github.com/${{ github.repository }}/releases/download/cd-latest/meta.json?_=$(date +%s)" 2>/dev/null \
              | grep -o '"sha":"[0-9a-f]*"' | head -1 | sed 's/.*:"//; s/"$//' || true)
            echo "poll $i/20 — CD en cours : $EN_COURS, dernier run : $DERNIER_CE_SHA, release : ${RELEASE_SHA:-absent}"
            if [ "$RELEASE_SHA" = "$SHA_MAIN" ]; then
              echo "Release cd-latest à jour ($SHA_MAIN) — le canal pull est autonome, fin d'attente."
              EN_COURS=0
              break
            fi
            if [ "$EN_COURS" != "0" ]; then sleep 60; else break; fi
          done
          if [ "$EN_COURS" != "0" ]; then
            echo "verdict=bloque (CD toujours en cours après 20 min d'attente)"
            LIBRE=non
          elif [ "$DERNIER_CE_SHA" = "failure" ]; then
            echo "verdict=bloque (build $SHA_MAIN en échec — ne pas réarmer)"
            LIBRE=non
          else
            echo "verdict=libre"
            LIBRE=oui
          fi
          echo "libre=$LIBRE" >> "$GITHUB_OUTPUT"

      - name: Empreinte du build publié sur la release cd-latest
        id: release
        if: steps.garde.outputs.libre == 'oui'
        run: |
          META=$(curl -fsSL -m 20 -H "Cache-Control: no-cache" \
            "https://github.com/${{ github.repository }}/releases/download/cd-latest/meta.json?_=$(date +%s)" || true)
          RS=$(printf '%s' "$META" | grep -o '"sha":"[0-9a-f]*"' | head -1 | sed 's/.*:"//; s/"$//' || true)
          # v4 (2026-10-28, itération 10 Job 478451) : WATCHDOG POLLER —
          # extraire publishedAt et calculer l'âge du build publié. Une
          # release fraîche (sha = main) non délivrée à la prod après
          # plusieurs cycles de 2 min = preuve directe que le poller VPS
          # est inactif/absent — signalé tel quel dans l'escalade au lieu
          # du diagnostic à l'aveugle (« bootstrap jamais fait »).
          RP=$(printf '%s' "$META" | grep -o '"publishedAt":"[^"]*"' | head -1 | sed 's/.*:"//; s/"$//' || true)
          AGE=""
          if [ -n "$RP" ]; then
            TS=$(date -u -d "$RP" +%s 2>/dev/null || true)
            [ -n "$TS" ] && AGE=$(( ($(date -u +%s) - TS) / 60 ))
          fi
          echo "release_sha=${RS:-absent}" >> "$GITHUB_OUTPUT"
          echo "release_age_min=${AGE}" >> "$GITHUB_OUTPUT"
          echo "Release cd-latest : ${RS:-absent} (publiée il y a ${AGE:-?} min)"
          echo "main              : ${{ needs.verifier.outputs.sha_main }}"

      - name: Sondage SSH léger (3 essais espacés)
        id: sonde
        if: steps.garde.outputs.libre == 'oui'
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 12 ssh-keyscan -T 8 -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" 2>/dev/null | grep -q "ssh-"; then
              ok=1
              echo "Sondage $i/3 : sshd répond — armement du canal pull possible."
              break
            fi
            echo "Sondage $i/3 : SSH muet (fail2ban / PerSourcePenalties ?) — production rattrapée au prochain tick ou par le poller pull."
            [ "$i" = "3" ] || sleep 30
          done
          echo "joignable=$([ $ok = 1 ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"

      # ARMEMENT DU CANAL PULL (le cœur du correctif structurel) :
      # install-pull-mode.sh est idempotent, non interactif, sans entrée
      # clavier. Il installe le poller PM2 (toutes les 2 min) PUIS lance
      # immédiatement le premier déploiement : la production rattrape main
      # pendant ce step, puis le VPS se déploie seul pour toujours
      # (téléchargement HTTPS sortant de la release, zéro SSH entrant).
      # Si le build en release est PÉRIMÉ (≠ main), on ne l'arme pas :
      # le secours CD publie un build frais d'abord.
      - name: Armer le canal pull sur le VPS (poller idempotent + déploiement immédiat)
        id: pull
        if: steps.sonde.outputs.joignable == 'oui' && steps.release.outputs.release_sha == needs.verifier.outputs.sha_main
        run: |
          if ssh -o ServerAliveInterval=30 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
               -p "${{ secrets.VPS_PORT }}" -i ~/.ssh/vps_deploy \
               "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
               "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash"; then
            echo "verdict=arme" >> "$GITHUB_OUTPUT"
            echo "✅ Canal pull ARMÉ : poller PM2 installé, premier déploiement lancé."
          else
            echo "verdict=echec" >> "$GITHUB_OUTPUT"
            echo "⚠️ Armement du canal pull échoué (permissions / coupure SSH ?) — secours CD."
          fi

      - name: Secours — déclencher le déploiement continu (canal SSH)
        if: steps.sonde.outputs.joignable == 'oui' && steps.pull.outputs.verdict != 'arme'
        run: |
          gh workflow run deploy-vps.yml --ref main -R "${{ github.repository }}"
          echo "✅ CD déclenché : production ${{ needs.verifier.outputs.sha_prod }} → main ${{ needs.verifier.outputs.sha_main }}."
        env:
          GH_TOKEN: ${{ github.token }}

      # V6.2 (2026-10-29, itération 26 Job 478451) — SECOURS SANS SSH :
      # constat 07:26→08:10Z : release cd-latest à jour, poller silencieux,
      # SSH muet (fail2ban/PerSourcePenalties) → prod gelée ~45 min. La
      # sortie de secours ne peut PAS être SSH : c'est le RENOUVELLEMENT
      # D'IP — chaque runner GitHub part d'une IP egress différente, et le
      # CD dispatched prend une fenêtre SSH neuve (livraison e5279375
      # prouvée 08:10Z par ce mécanisme, exécuté manuellement). Conditions
      # conjonctives strictes (anti-spam) : release PUBLIÉE et à jour
      # (release_sha == main), âge ≥ 10 min (le poller a eu ses 5 cycles
      # — même seuil du watchdog v6.1), sonde SSH muette. Le CD référencé
      # est sérialisé par sa concurrency (deploy-vps) ; l'escalade v6.1
      # voit ce CD « in_progress » via son garde existant → pas de faux
      # positif pendant qu'il livre.
      - name: "Secours sans SSH — redéclencher le CD (renouvellement d'IP runner)"
        id: secours-ip
        if: steps.sonde.outputs.joignable != 'oui' && steps.release.outputs.release_sha == needs.verifier.outputs.sha_main && (steps.release.outputs.release_age_min || 0) >= 10
        run: |
          gh workflow run deploy-vps.yml --ref main -R "${{ github.repository }}"
          echo "✅ CD déclenché SANS SSH (renouvellement d'IP runner) : release cd-latest ${RELEASE_SHA:0:8} publiée depuis ${RELEASE_AGE} min, poller silencieux, prod = ${SHA_PROD:0:8} → main = ${SHA_MAIN:0:8}."
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_MAIN: ${{ needs.verifier.outputs.sha_main }}
          SHA_PROD: ${{ needs.verifier.outputs.sha_prod }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_AGE: ${{ steps.release.outputs.release_age_min }}

      - name: Rapport du tick
        if: always()
        run: |
          echo "=== Guérisseur — tick $(date -u +%FT%TZ) ==="
          echo "prod    = ${{ needs.verifier.outputs.sha_prod }}"
          echo "main    = ${{ needs.verifier.outputs.sha_main }}"
          echo "release = ${{ steps.release.outputs.release_sha }} (âge ${{ steps.release.outputs.release_age_min || '?' }} min)"
          echo "garde   = ${{ steps.garde.outcome }} (${{ steps.garde.outputs.libre }})"
          echo "sonde   = ${{ steps.sonde.outcome }} (${{ steps.sonde.outputs.joignable }})"
          echo "pull    = ${{ steps.pull.outcome }} (${{ steps.pull.outputs.verdict }})"
          echo "secours-ip = ${{ steps.secours-ip.outcome || 'skipped' }} (v6.2 renouvellement d'IP)"
          echo "Rappel : le canal pull (poller VPS, install console unique) rend ce rattrapage instantané —"
          echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash"

      # ESCALADE VISIBLE (correctif Job 478451 — constat du 2026-10-28) :
      # quand la production est en retard ET le SSH muet, ce workflow
      # finissait « success » sans rien faire ni rien dire — une production
      # a pu rester gelée ~8 h (8 commits) sans AUCUN signal. Désormais :
      # ouverture/mise à jour d'une issue dédiée avec l'action exacte à
      # mener sur la console du fournisseur (installation du mode pull,
      # une seule commande, sans SSH). L'issue est refermée automatiquement
      # dès que la production est réalignée (tick « besoin=false »).
      - name: "Escalade — issue visible quand prod en retard + SSH muet"
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_MAIN: ${{ needs.verifier.outputs.sha_main }}
          SHA_PROD: ${{ needs.verifier.outputs.sha_prod }}
          BESOIN: ${{ needs.verifier.outputs.besoin }}
          JOIGNABLE: ${{ steps.sonde.outputs.joignable }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_AGE_MIN: ${{ steps.release.outputs.release_age_min }}
          REPO: ${{ github.repository }}
        run: |
          TITRE="🚨 Production en retard sur main — intervention console VPS requise"
          if [ "$BESOIN" != "true" ]; then
            # Production alignée : refermer l'issue d'escalade si elle existe.
            NUM=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" -R "$REPO" -c "✅ Production réalignée sur main ($SHA_MAIN) — escalade résolue automatiquement."
              echo "Issue #$NUM refermée (production alignée)."
            fi
            exit 0
          fi
          # Production en retard : n'escalader que si SSH muet (sinon le
          # guérisseur/CD gèrent le rattrapage sans bruit).
          if [ "$JOIGNABLE" = "oui" ]; then
            echo "SSH joignable — rattrapage en cours par les canaux normaux, pas d'escalade."
            exit 0
          fi

          # v6.2 — GARDE « SECOURS VENANT DE S'ARMER » : si le nouveau
          # secours sans SSH vient de déclencher un CD CE tick (renouvellement
          # d'IP runner), pas d'escalade — l'action vient d'être prise et le
          # CD construit ~6-8 min avant de livrer ; le garde « CD en cours »
          # ci-dessous ne verrait pas encore le run (latence API) et ouvrirait
          # un faux positif. Le prochain tick escaladera si CE secours-là
          # échoue à son tour (escalade = preuve d'échec en chaîne, pas
          # d'impatience).
          if [ "${{ steps.secours-ip.outcome || '' }}" = "success" ]; then
            echo "Secours sans SSH déclenché ce tick (renouvellement d'IP) — pas d'escalade, le prochain tick jugera le résultat."
            exit 0
          fi

          # v5 — GARDE « CD EN COURS » : un run CD in_progress/queued sur le
          # SHA de main est un canal de livraison LÉGITIME. Escalader
          # « poller inactif » pendant qu'il livre = faux positif garanti.
          # v6 (2026-10-29, itération 21) — GARDE FAIL-CLOSED : le 01:45Z,
          # l'appel API a échoué (rate limit Actions) et le repli « || echo 0 »
          # a FAIL-OPEN (« données manquantes » traité comme « aucun CD ») →
          # escalade #108 créée pendant que le CD du même push livrait
          # (swap intervenu ~1 min après). Désormais : 3 essais espacés ;
          # si TOUS échouent → état « indéterminable » → PAS d'escalade ce
          # tick (renoncer à brailler une fois vaut mieux qu'un faux
          # positif : le tick suivant re-décidera). Filtre élargi aux états
          # d'attente (waiting/pending) des files de concurrency.
          CD_EN_COURS=""
          for i in 1 2 3; do
            CD_EN_COURS=$(curl -fsSL -m 20 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/deploy-vps.yml/runs?per_page=10" 2>/dev/null \
              | jq '[.workflow_runs[] | select(.head_sha=="'"$SHA_MAIN"'" and (.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending"))] | length' 2>/dev/null) && [ -n "$CD_EN_COURS" ] && break
            CD_EN_COURS=""
            [ "$i" = "3" ] || sleep 10
          done
          if [ -z "$CD_EN_COURS" ]; then
            echo "État du CD indéterminable (API injoignable 3×) — pas d'escalade ce tick (garde fail-closed)."
            exit 0
          fi
          if [ "$CD_EN_COURS" != "0" ]; then
            echo "CD encore en cours sur $SHA_MAIN — pas d'escalade ce tick (livraison possible en cours)."
            exit 0
          fi

          # v5 — RE-MESURE FRAÎCHE avant tout bruit : SHA_PROD a été mesuré
          # par le job verifier PLUSIEURS MINUTES plus tôt (le CD du même
          # push a pu livrer entre-temps — faux positif constaté 00:27 UTC).
          # 3 lectures espacées, cache-buster ; alignement détecté =
          # refermeture immédiate de l'escalade, jamais de faux « toujours
          # en retard ».
          SHA_PROD_REEL=""
          for i in 1 2 3; do
            SHA_PROD_REEL=$(curl -fsSL -m 20 "https://gen3ia.online/version.json?rm=$(date +%s)-$i" 2>/dev/null \
              | jq -r '.gitSha // ""' 2>/dev/null || true)
            if [ "$SHA_PROD_REEL" = "$SHA_MAIN" ]; then break; fi
            [ "$i" = "3" ] || sleep 15
          done
          if [ "$SHA_PROD_REEL" = "$SHA_MAIN" ]; then
            NUM_ALIGNE=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$NUM_ALIGNE" ]; then
              gh issue close "$NUM_ALIGNE" -R "$REPO" -c "✅ Production réalignée sur main ($SHA_MAIN) — re-mesure fraîche du guérisseur (le SHA du job verifier était périmé, livraison CD intervenue entre-temps). Escalade résolue automatiquement."
              echo "Issue #$NUM_ALIGNE refermée (alignement détecté par re-mesure fraîche)."
            else
              echo "Production alignée en re-mesure ($SHA_MAIN) — aucune escalade ouverte, rien à faire."
            fi
            exit 0
          fi
          SHA_PROD="${SHA_PROD_REEL:-$SHA_PROD}"  # le tick commente le SHA RE-MESURÉ, jamais le SHA périmé

          # v6.1 (2026-10-29, itération 21) — SEUIL DU WATCHDOG : le
          # téléchargement du build (~205 Mo, reprise backoff) + swap prennent
          # 5-15 min ; clamer « poller inactif » dès l'âge 0 min de la release
          # = faux diagnostic systématique (constaté toute la journée du
          # 29 oct. : ticks « publiée il y a 0 min … poller inactif » alors
          # que le poller livrait en ~10 min — cf. #108, prod alignée sans
          # aucun swap CD). Ne conclure au poller inactif QUE si la release
          # a eu LE TEMPS d'être téléchargée et basculée (≥ 10 min = 5 cycles
          # de 2 min + marge de téléchargement). Avant ce seuil : réévaluation
          # au prochain tick, sans bruit.
          AGE_RELEASE=${RELEASE_AGE_MIN:-0}
          case $AGE_RELEASE in ''|*[!0-9]*) AGE_RELEASE=0 ;; esac
          if [ "$AGE_RELEASE" -lt 10 ]; then
            echo "Release trop récente (${AGE_RELEASE} min) pour conclure au poller inactif — téléchargement ~205 Mo + swap ≈ 5-15 min. Réévaluation au prochain tick (sans bruit)."
            exit 0
          fi
          CORPS=$(cat <<'EOF'
          ## Production gen3ia.online en retard sur main

          - SHA main        : `%SHA_MAIN%`
          - SHA production  : `%SHA_PROD%`
          - SSH entrant     : muet (fail2ban / PerSourcePenalties côté VPS)
          - Canal pull      : release cd-latest `%REL8%` publiée il y a %AGE% min
            — **non délivrée** à la production (≥ %CYCLES% cycles de 2 min manqués)
            → **poller VPS inactif ou absent** (watchdog, preuve horodatée)

          **Conséquence** : les builds CD sont publiés sur la release `cd-latest`
          mais la production ne les récupère jamais — corrections utilisateur
          (anti-désinformation, statut, CVE) invisibles en production.

          **Action unique à mener depuis la console du fournisseur VPS
          (spaceship.com → console root)** — une seule commande, sans SSH :

          ```
          curl -fsSL https://raw.githubusercontent.com/missock237-spec/gen3ia/main/scripts/vps-auto-deploy/install-pull-mode.sh | bash
          ```

          Elle installe le poller (2 min de cycle, HTTPS sortant uniquement),
          lance immédiatement le premier déploiement, et rend le VPS autonome
          vis-à-vis du SSH pour toujours. Vérification ensuite :

          ```
          curl -s https://gen3ia.online/version.json
          ```

          _Issue ouverte automatiquement par le guérisseur (Job 478451).
          Refermeture automatique dès que la production est alignée._
          EOF
          )
          CORPS="${CORPS//\%SHA_MAIN\%/$SHA_MAIN}"
          CORPS="${CORPS//\%SHA_PROD\%/$SHA_PROD}"
          REL8="${RELEASE_SHA:0:8}"
          CYCLES=$(( ${RELEASE_AGE_MIN:-0} / 2 ))
          CORPS="${CORPS//\%REL8\%/${REL8:-absent}}"
          CORPS="${CORPS//\%AGE\%/${RELEASE_AGE_MIN:-?}}"
          CORPS="${CORPS//\%CYCLES\%/$CYCLES}"
          NUM=$(gh issue list -R "$REPO" --state open --search "$TITRE in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" -R "$REPO" -b "Tick $(date -u +%FT%TZ) — toujours en retard (re-mesuré à $(date -u +%H:%M:%SZ)) : prod=${SHA_PROD:0:8}, main=${SHA_MAIN:0:8}, SSH muet, release cd-latest=${REL8:-absent} non délivrée depuis ${RELEASE_AGE_MIN:-?} min (= poller inactif)."
            echo "Issue #$NUM commentée (escalade en cours)."
          else
            gh issue create -R "$REPO" --title "$TITRE" --body "$CORPS" >/dev/null \
              && echo "Issue d'escalade créée."
          fi

  sonder:
    name: Déclencher la surveillance synthétique (crons GitHub défaillants)
    needs: [verifier, guerir]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch de la sonde HTTP (déclencheur événementiel fiable)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Constat it.28 : les crons GitHub de ce dépôt sont massivement
          # sautés (surveillance : 0 run cron sur 4 slots 08:37→10:07Z ;
          # guérisseur : 1 run schedule sur 8). Le couplage par ÉVÉNEMENT
          # (fin du guérisseur, lui-même déclenché à chaque push) garantit
          # que la sonde HTTP s'exécute après chaque évaluation de prod.
          # Le cron 7,37 reste le filet ; le cycle d'issue anti-spam
          # (édition du corps d'issue, pas de commentaire) tolère la
          # fréquence. Pas de boucle : la surveillance ne dispatch rien.
          gh workflow run surveillance-production.yml -R "$REPO" --ref main \
            && echo "Sonde HTTP dispatchée (exécution asynchrone)." \
            || echo "Dispatch impossible (transitoire) — le cron 7,37 reste le filet."
