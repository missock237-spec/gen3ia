# =====================================================================
# Gen3ia — politique de cache « mise à jour forcée » (plan 4 étapes,
# 2026-10-23 — Étape 1 : en-têtes HTTP côté serveur web).
#
# OÙ L'APPLIQUER : à l'intérieur du bloc server { } existant de
# gen3ia.online (vhost nginx du VPS), en ADAPTANT le proxy_pass au
# upstream/asset déjà utilisé par le location / de ce vhost.
#
# ⚠️ Pourquoi l'exemple générique du plan (\.(html|json)$ sur tout le
# site) a été AFFINÉ : les fichiers JSON de /_next/static/ (buildManifest,
# chunks RSC préchargés…) sont NOMMÉS PAR HASH — leur valeur est un cache
# long « immutable ». Un bloc regex qui les toucherait forcerait le
# retéléchargement de plusieurs Mo à chaque visite. Le bloc ^~ ci-dessous
# les protège : en nginx, un préfixe ^~ court-circuite les regex.
#
# ⚠️ Piège nginx connu : dès qu'un bloc location déclare UN add_header,
# il N'HÉRITE PLUS des add_header posés au niveau server { } — les
# réponses passant par ces blocs perdraient sinon les en-têtes de
# sécurité. On re-déclare donc nosniff ici (complétez si votre vhost en
# pose d'autres).
#
# NB : la couche Next.js impose DÉJÀ no-store sur /version.json
# (next.config.ts) et max-age=0 sur /sw.js + /offline.html. Ce fichier est
# la double ceinture côté serveur web + l'outil qui neutraliserait un
# futur cache intermédiaire (CDN, Varnish…).
# =====================================================================

# 1) Assets immuables (noms hashés par Next) : cache long — PRIORITAIRE
#    sur le bloc regex HTML/JSON ci-dessous.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# 2) Manifeste de version sondé par les navigateurs : JAMAIS caché.
location = /version.json {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
    add_header X-Content-Type-Options "nosniff" always;
}

# Variante RÉSILIENTE (optionnelle, à privilégier si le vhost sert déjà
# des fichiers depuis le disque) : le manifeste répond directement depuis
# public/ — même si le process Node/PM2 est arrêté ou en redémarrage :
#
# location = /version.json {
#     root /opt/gen3ia/public;
#     try_files /version.json =404;
#     add_header Cache-Control "no-store, no-cache, must-revalidate";
#     add_header X-Content-Type-Options "nosniff" always;
# }

# 3) Documents HTML et fichiers de métadonnées JSON : jamais cachés —
#    le navigateur revient toujours chercher la dernière entrée
#    applicative. /sw.js et /offline.html ne correspondent pas à ce bloc
#    et restent servis avec leurs en-têtes Next (max-age=0 must-revalidate).
location ~* \.(html|json)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
    add_header X-Content-Type-Options "nosniff" always;
}

# Vérification après application + reload nginx :
#   curl -sI https://gen3ia.online/version.json | grep -i cache-control
#     → no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0
#   curl -sI "https://gen3ia.online/_next/static/chunks/$(curl -s https://gen3ia.online/ | grep -oE 'chunks/[a-f0-9]+\.[a-f0-9]+\.js' | head -1 | cut -d/ -f2-)" | grep -i cache-control
#     → public, max-age=31536000, immutable   (le cache long doit SURVIVRE)
#   curl -s https://gen3ia.online/version.json
#     → {"version":"<BUILD_ID>", …} identique à /api/deploy-info
