# Gitleaks — détection de fuites de secrets (Task 39, Rec 3.1).
#
# Règles par défaut de gitleaks (clés AWS/GCP/OpenAI/Slack, tokens
# GitHub/Google, PEM privés…) + exceptions Gen3ia : les fichiers de test
# contiennent des placeholders ÉVIDENTS (jamais de vraie clé) et des
# identités factices cryptographiques générées à la volée (vitest).
# Lancer : gitleaks detect --source . --config .gitleaks.toml
# CI : job "secrets" (gitleaks/gitleaks-action).

title = "Gen3ia — politique de détection de secrets"

[extend]
# Jeu de règles par défaut de gitleaks (≈150 détecteurs de fournisseurs).
useDefault = true

[allowlist]
description = "Placeholders de tests, clés publiques du SDK Firebase Web (non secrètes par conception), fixtures générées"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)vitest/stubs/''',
  '''(^|/)tests/e2e/''',
  '''(^|/)docs/''',
  '''package-lock\.json$''',
  '''pnpm-lock\.yaml$''',
  # Fixtures du test du module de chiffrement envelope : clés/secrets
  # volontairement factices (Task 98) — jamais de valeur réelle.
  '''lib/security/secret-envelope\.test\.ts$''',
  # Fixtures des tests de gestion des clés API entreprise (Task 126) :
  # chaînes « g3a_… » volontairement factices (jamais de valeur réelle) —
  # le détecteur générique gitleaks (mot-clé key: + entropie) sinon
  # fausse alerte inévitable sur ce fichier par nature.
  '''app/api/settings/api-keys/route\.test\.ts$''',
  # Fixtures des tests du masquage de secrets (lib/security) : le module
  # testé EST le masque de secrets — ses jeux d'essai sont des faux
  # évidents (sk-proj-fake0000…, fakeJwt à signature « forged-signature »,
  # API_KEY abcd1234efgh5678). Aucune valeur réelle par construction.
  '''lib/security/secret-masking\.test\.ts$''',
  # Fixture du test d'intégration des API personnalisées : la même chaîne
  # factice abcd1234efgh5678 sert uniquement à vérifier le masquage.
  '''lib/integrations/custom-apis/client\.test\.ts$''',
  # Script E2E cycle 03 (durcissement session) : cookies de session
  # FORGÉS à dessein (signature « forged-signature », « garbage-not-jwt »)
  # pour vérifier le rejet des sessions invalides — jamais un vrai jeton.
  '''scripts/e2e_cycle03_prod\.mjs$''',
  # Fixture du test de la file de ticks (R2) : secret nommé REAL_SECRET
  # mais valeur littéralement « r2-secret-for-tests-0123456789abcdef » —
  # placeholder de banc d'essai, aucune valeur réelle.
  '''lib/queue/tick-queue\.test\.ts$''',
  # Fixture du test du stockage clé-valeur chiffré : la chaîne « api_key: … »
  # est un JEUX D'ESSAI volontaire du masquage de credentials (assertion du
  # message d'erreur) — placeholder factice, jamais une clé réelle.
  '''lib/memory/keyvalue\.test\.ts$''',
  # Curriculum d'entraînement gen3ia (JSONL synthétiques bilingues FR/EN,
  # générés de façon déterministe par scripts/build_curriculum_v3.py) :
  # du TEXTE pédagogique sans aucun secret réel — ex. « LinkedIn post »
  # déclenche à tort la règle linkedin-client-id. Générateurs versionnés :
  # toute vraie fuite dans ces fichiers serait aussi dans les scripts, non
  # couverts par cette exclusion.
  '''^datasets/[^/]+/train\.jsonl$''',
  # README de l'orchestrateur : la version historique (e6951d8) contenait des
  # placeholders « X-API-Key: … » déjà corrigés en $QUEUE_API_KEY (2c90d2a) ;
  # les anciens commits restent dans l'historique scanné par la CI.
  '''^orchestrator-24h/README_FR\.md$''',
]
# Clés d'API Web Firebase NEXT_PUBLIC_* : par conception publiques
# (identifient le projet, ne donnent aucun accès sans règles de sécurité).
regexes = [
  '''AIzaSyCWeyTdWPj0HjIfo0EyLPldAeRrSIyBJbQ''',
  '''gen3ia-b5a92\.firebaseapp\.com''',
]
# Exemples / documents explicatifs contenant des tokens factices.
commits = []
