# =====================================================================
# Gen3ia — sous-domaine PUBLIC de statut : status.gen3ia.online
# (axe 5, audit 2 nov. 2026 : « page de statut publique »).
#
# QUOI : tout le sous-domaine sert la page publique /status de
# gen3ia.online (même process Next.js — zéro code nouveau, zéro état
# dupliqué : la page relit les sondes à chaque requête).
#
# INSTALLATION : idempotente, via le script
#   curl -fsSL https://raw.githubusercontent.com/missock237-spec/gen3ia/main/scripts/vps-auto-deploy/install-status-domain.sh | bash
# Le script dépose ce fichier dans /etc/nginx/conf.d/, teste la syntaxe
# (nginx -t) puis recharge ; il vérifie ensuite la réponse locale avec
# l'en-tête Host: status.gen3ia.online.
#
# PRÉ-REQUIS OPÉRATEUR (hors automatisation — registrar du domaine) :
#   1. Enregistrement DNS : status.gen3ia.online → IP publique du VPS
#      (A) ou alias de gen3ia.online (CNAME).
#   2. Certificat TLS : après propagation DNS, étendre Let's Encrypt :
#      certbot --nginx -d status.gen3ia.online --expand
#      (le script l'affiche et le propose, jamais exécuté sans vous).
#
# NB honnêteté : jusqu'à propagation DNS + certificat, l'URL publique
# gen3ia.online/status reste LA page de référence — ce sous-domaine est
# un alias d'accès supplémentaire, pas une dépendance.
# =====================================================================

server {
    listen 80;
    server_name status.gen3ia.online;

    # Sondes d'uptime : réponses fraîches, jamais cachées (la page
    # /status est force-dynamic et se rafraîchit d'elle-même en 60 s).
    location / {
        proxy_pass http://127.0.0.1:3000/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
