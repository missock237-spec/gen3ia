# Gen3ia — Configuration Supabase locale (Task 40)
# Référence : https://supabase.com/docs/guides/local-development/cli/config
project_id = "gen3ia"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://gen3ia.online"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Phase 1 (ADR-006) : Firebase Auth reste l'IdP. Supabase Auth est activé
# en local pour préparer la phase 3 mais aucun code produit n'y accède.

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
